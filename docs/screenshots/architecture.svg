<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="440" rx="16" fill="url(#bgGrad)" />

  <!-- Grid decoration lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="440" />
    <line x1="280" y1="0" x2="280" y2="440" />
    <line x1="640" y1="0" x2="640" y2="440" />
    <line x1="880" y1="0" x2="880" y2="440" />
  </g>

  <!-- Title Badge -->
  <rect x="40" y="30" width="340" height="32" rx="8" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="1" />
  <text x="52" y="51" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">SYSTEM ARCHITECTURE · SPOTTER ASSESSMENT</text>

  <!-- Subtitle -->
  <text x="40" y="86" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Weather-Aware Truck Route Planning &amp; Heatmap Pipeline</text>

  <!-- 1. Frontend Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="115" width="220" height="280" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5" />
    <rect x="40" y="115" width="220" height="42" rx="12" fill="#1e293b" />
    <text x="56" y="141" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">React 19 + TypeScript (Vercel)</text>

    <!-- UI Items -->
    <rect x="56" y="172" width="188" height="38" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="68" y="188" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TripForm (Inputs &amp; Validation)</text>
    <text x="68" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Origin, Dest, Weight, 10/25/50mi</text>

    <rect x="56" y="220" width="188" height="38" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="68" y="236" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RouteCards (3 Routes)</text>
    <text x="68" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Recommended badge, tie-break reason</text>

    <rect x="56" y="268" width="188" height="38" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="68" y="284" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MapView (MapLibre GL)</text>
    <text x="68" y="298" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">WebGL layers, popups, auto fitBounds</text>

    <rect x="56" y="316" width="188" height="38" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="68" y="332" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ForecastSlider (0–48h)</text>
    <text x="68" y="346" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">60fps scrubbing with 0 network calls</text>

    <text x="56" y="380" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">POST /api/trips/plan →</text>
  </g>

  <!-- Arrow Frontend -> Backend -->
  <path d="M 260 255 L 290 255" stroke="url(#accentGrad)" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 2. Backend Orchestrator Box -->
  <g filter="url(#shadow)">
    <rect x="295" y="115" width="310" height="280" rx="12" fill="url(#blueCard)" stroke="#4338ca" stroke-width="1.5" />
    <rect x="295" y="115" width="310" height="42" rx="12" fill="#1e1b4b" />
    <text x="312" y="141" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Django 5 Services Pipeline (Render)</text>

    <!-- Step 1 -->
    <rect x="310" y="168" width="280" height="32" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="320" y="188" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5"><tspan font-weight="bold" fill="#60a5fa">Step 1:</tspan> TomTom Truck Routing (3 Routes)</text>

    <!-- Step 2 -->
    <rect x="310" y="206" width="280" height="32" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="320" y="226" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5"><tspan font-weight="bold" fill="#34d399">Step 2:</tspan> Sampler (5-mi base + piecewise ETA)</text>

    <!-- Step 3 -->
    <rect x="310" y="244" width="280" height="32" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="320" y="264" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5"><tspan font-weight="bold" fill="#fbbf24">Step 3:</tspan> Open-Meteo Batched Hourly Forecast</text>

    <!-- Step 4 -->
    <rect x="310" y="282" width="280" height="32" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="320" y="302" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5"><tspan font-weight="bold" fill="#f87171">Step 4:</tspan> Risk Engine (Weather + Gross Load Rules)</text>

    <!-- Step 5 -->
    <rect x="310" y="320" width="280" height="32" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="320" y="340" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5"><tspan font-weight="bold" fill="#c084fc">Step 5:</tspan> 4-Step Lexicographic Ranker (Tuple)</text>

    <!-- Cache note -->
    <text x="312" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">LocMem / Upstash Redis · 1h plan cache</text>
  </g>

  <!-- Arrow Backend -> Third-party -->
  <path d="M 605 255 L 635 255" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- 3. External Sources & Data Pipeline -->
  <g filter="url(#shadow)">
    <rect x="640" y="115" width="240" height="280" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5" />
    <rect x="640" y="115" width="240" height="42" rx="12" fill="#1e293b" />
    <text x="656" y="141" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Data Sources &amp; Tile Engines</text>

    <rect x="655" y="172" width="210" height="44" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="668" y="190" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TomTom Routing &amp; Search</text>
    <text x="668" y="206" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Truck mode, coded offsets, alternatives</text>

    <rect x="655" y="226" width="210" height="44" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="668" y="244" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Open-Meteo Forecast</text>
    <text x="668" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">ECMWF hourly, 0.1° grid, rain+showers</text>

    <rect x="655" y="280" width="210" height="44" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="668" y="298" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">OpenFreeMap Liberty Tiles</text>
    <text x="668" y="314" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Vector basemaps, zero API key/watermark</text>

    <!-- Risk Badge Legend -->
    <g transform="translate(655, 342)">
      <circle cx="8" cy="18" r="5" fill="#22c55e" />
      <circle cx="34" cy="18" r="5" fill="#eab308" />
      <circle cx="60" cy="18" r="5" fill="#f97316" />
      <circle cx="86" cy="18" r="5" fill="#ef4444" />
      <circle cx="112" cy="18" r="5" fill="#581c87" />
      <text x="126" y="22" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">5 Risk Levels</text>
    </g>
  </g>
</svg>
